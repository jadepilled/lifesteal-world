server {
    listen 80;
    listen [::]:80;
    server_name radio.lifesteal.world 178.156.209.199 178-156-209-199.sslip.io;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /now-playing.json {
        alias /srv/lifesteal-radio/public/now-playing.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://lifesteal.world" always;
    }

    location /artwork/ {
        alias /srv/lifesteal-radio/public/artwork/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "https://lifesteal.world" always;
    }

    location = /stream.mp3 {
        proxy_pass http://127.0.0.1:8000/stream.mp3;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://lifesteal.world" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    }
}
